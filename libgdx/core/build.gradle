// ============================================================
// core/build.gradle — Core Game Logic Module
// Platform-independent: no LWJGL, no GLFW, no platform natives
// Only LibGDX core + ImGui binding (for shared editor types)
// ============================================================

dependencies {
    // LibGDX core (math, graphics, utils, files, audio)
    implementation "com.badlogicgames.gdx:gdx:1.12.1"

    // ImGui Java binding (core, no platform-specific natives here)
    implementation "io.github.spair:imgui-java-binding:1.86.11"

    // EditorUI drives the GLFW window and ImGui's GL3 renderer directly, so core
    // also needs the LWJGL3 backend and imgui-java-lwjgl3 to compile.
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.12.1"
    implementation "io.github.spair:imgui-java-lwjgl3:1.86.11"

    // JSON (LibGDX built-in — replaces Gson)
    // No external dependency needed, Json is in gdx core

    // Testing
    testImplementation "junit:junit:4.13.2"
}
